<header class="topbar">
  <button
    class="hamburger"
    aria-label="Toggle menu"
    (click)="menu.toggle()"
  >
    <svg
      lucideMenu
      [size]="20"
      [strokeWidth]="1.8"
    ></svg>
  </button>

  <div class="search">
    <svg
      lucideSearch
      [size]="19"
      [strokeWidth]="1.8"
    ></svg>

    <input
      type="text"
      placeholder="Search projects, tasks, or people..."
    />

    <span class="shortcut">Ctrl K</span>
  </div>

  <div class="topbar-actions">
    <button
      class="notification"
      aria-label="Notifications"
    >
      <svg
        lucideBell
        [size]="20"
        [strokeWidth]="1.8"
      ></svg>

      <span>3</span>
    </button>

    <div class="profile-wrapper">
      <button
        type="button"
        class="profile"
        aria-label="Open profile menu"
        [attr.aria-expanded]="profileMenuOpen()"
        (click)="toggleProfileMenu()"
      >
        <div class="avatar">A</div>

        <div class="profile-info">
          <strong>Arpit Agarwal</strong>
          <small>Product Manager</small>
        </div>

        <svg
          class="chevron"
          [class.open]="profileMenuOpen()"
          lucideChevronDown
          [size]="17"
          [strokeWidth]="1.8"
        ></svg>
      </button>

      @if (profileMenuOpen()) {
        <div class="profile-menu">
          <button
            type="button"
            class="profile-menu-item logout-item"
            (click)="logout()"
          >
            <svg
              lucideLogOut
              [size]="17"
              [strokeWidth]="1.8"
            ></svg>

            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
