<header class="topbar">
  <button class="hamburger" aria-label="Toggle menu" (click)="menu.toggle()">
    <svg lucideMenu [size]="20" [strokeWidth]="1.8"></svg>
  </button>
  <div class="search">
    <svg
      lucideSearch
      [size]="19"
      [strokeWidth]="1.8"
    ></svg>

    <input
      type="text"
      placeholder="Search projects, tasks, or people..."
    />

    <span class="shortcut">Ctrl K</span>
  </div>

  <div class="topbar-actions">
    <button class="notification" aria-label="Notifications">
      <svg
        lucideBell
        [size]="20"
        [strokeWidth]="1.8"
      ></svg>

      <span>3</span>
    </button>

    <div class="profile">
      <div class="avatar">A</div>

      <div class="profile-info">
        <strong>Arpit Agarwal</strong>
        <small>Product Manager</small>
      </div>

      <svg
        class="chevron"
        lucideChevronDown
        [size]="17"
        [strokeWidth]="1.8"
      ></svg>
    </div>
  </div>
</header>
